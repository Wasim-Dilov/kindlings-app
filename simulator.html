<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kindlings Home Twin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A phone-first digital twin of the family home for testing the Kindlings pet companions.">
<meta name="theme-color" content="#1E2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kindlings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* Layout: a handheld "home twin" console. Phone portrait: mode bar, game screen, pet HUD, control deck.
     Phone landscape: the D-pad and A/B flank the screen. Wide screens: console on the left, twin panel on the right. */
  --shell:#FFF4E0; --shell-2:#F5E4C3; --raise:#FFFBF3; --ink:#1E2233; --ink-2:#5B6078; --line:#E3CFA8;
  --bezel:#1E2233; --screen-edge:#2B3047;
  --btn-a:#FF7A1A; --btn-b:#8B6FD6; --btn-ink:#1E2233; --dpad:#2B3047; --dpad-ink:#FFF4E0; --dpad-hi:#3D4462;
  --lion:#C9691F; --panda:#23866F; --accent:#2F6FD1; --accent-soft:#E1EAFB;
  --good:#2E7D4F; --good-soft:#DDF1E3; --warn:#9A5F0E; --warn-soft:#FBEBCF; --crit:#B43A2F; --crit-soft:#F8DEDA;
  --c1:#E08A2E; --c2:#2F9C82; --c3:#7A5CC8; --c4:#2F6FD1;
  --dlg-bg:#FFFBF3; --dlg-ink:#1E2233; --dlg-edge:#1E2233;
  --scrim:rgba(20,22,34,.45);
  --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shell:#141826; --shell-2:#1C2234; --raise:#232A42; --ink:#F4ECDC; --ink-2:#A9AEC4; --line:#323A58;
    --bezel:#06080E; --screen-edge:#0E1120;
    --dpad:#3A4266; --dpad-ink:#F4ECDC; --dpad-hi:#4B5480;
    --lion:#F2A24E; --panda:#5CCDB0; --accent:#86AEF7; --accent-soft:#1F2C4C;
    --good:#6FCB91; --good-soft:#1B3326; --warn:#E5B05A; --warn-soft:#3A2E17; --crit:#F08A80; --crit-soft:#3D2220;
    --c1:#F2A24E; --c2:#5CCDB0; --c3:#A88BF0; --c4:#86AEF7;
    --dlg-bg:#232A42; --dlg-ink:#F4ECDC; --dlg-edge:#F4ECDC;
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --shell:#141826; --shell-2:#1C2234; --raise:#232A42; --ink:#F4ECDC; --ink-2:#A9AEC4; --line:#323A58;
  --bezel:#06080E; --screen-edge:#0E1120;
  --dpad:#3A4266; --dpad-ink:#F4ECDC; --dpad-hi:#4B5480;
  --lion:#F2A24E; --panda:#5CCDB0; --accent:#86AEF7; --accent-soft:#1F2C4C;
  --good:#6FCB91; --good-soft:#1B3326; --warn:#E5B05A; --warn-soft:#3A2E17; --crit:#F08A80; --crit-soft:#3D2220;
  --c1:#F2A24E; --c2:#5CCDB0; --c3:#A88BF0; --c4:#86AEF7;
  --dlg-bg:#232A42; --dlg-ink:#F4ECDC; --dlg-edge:#F4ECDC;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--shell);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- App grid ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "screen" "hud" "deck";gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;max-width:1500px;margin:0 auto}
.top{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--ink-2);font-size:12px;white-space:nowrap}
.modes{margin-left:auto;display:inline-flex;background:var(--shell-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:999px;padding:6px 11px;min-height:48px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--shell)}

/* ---------- Screen ---------- */
.screen{grid-area:screen;position:relative;min-height:0;background:var(--bezel);border-radius:18px;padding:6px;box-shadow:inset 0 0 0 2px var(--screen-edge)}
.screen-inner{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:#5FAE57}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;user-select:none;-webkit-user-select:none}
.hud-top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(30,34,51,.82);color:#FFF4E0;border:0;border-radius:10px;padding:5px 9px;font-family:var(--display);font-weight:700;font-size:13px;line-height:1.1;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis;min-height:30px}
.chip.scen{margin-left:auto;background:rgba(255,244,224,.9);color:#1E2233;position:relative}
.chip.scen::after{content:"";position:absolute;inset:-9px -4px}
.app[data-mode="play"] .chip.scen{display:none}
.app[data-mode="play"] .hud-top{justify-content:flex-end;top:64px}
.app[data-mode="play"] .chip small{display:none}
.chip small{font-weight:600;opacity:.8}
.banner{position:absolute;left:50%;top:46px;transform:translateX(-50%);background:rgba(30,34,51,.86);color:#FFF4E0;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.camchip{position:absolute;right:8px;bottom:8px}

/* Dialogue box: original "window card" style, thick ink border with a notched corner */
.dialog{position:absolute;left:8px;right:8px;bottom:8px;background:var(--dlg-bg);color:var(--dlg-ink);border:3px solid var(--dlg-edge);border-radius:6px 16px 6px 16px;box-shadow:0 4px 0 rgba(0,0,0,.28);padding:10px 12px 10px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;max-height:62%;overflow:auto}
.dialog.no-portrait{grid-template-columns:minmax(0,1fr)}
.dlg-portrait{width:64px;height:64px;border-radius:12px;background:var(--shell-2);display:grid;place-items:center;overflow:hidden}
.dlg-portrait svg{width:64px;height:64px;display:block}
.dlg-name{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.dlg-name .tag{font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;background:var(--shell-2);border-radius:6px;padding:1px 6px}
.dlg-text{margin:3px 0 0;font-family:var(--display);font-size:17px;line-height:1.35;font-weight:600;min-height:1.35em;overflow-wrap:anywhere}
.dlg-next{position:absolute;right:12px;bottom:6px;font-size:14px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.dlg-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dlg-choices button{min-height:48px;padding:6px 12px;border-radius:10px;border:2px solid var(--dlg-edge);background:var(--dlg-bg);font-family:var(--display);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.dlg-choices button.ic{flex-direction:column;justify-content:center;gap:2px;min-width:68px;min-height:68px;padding:6px 8px;font-size:12.5px;line-height:1.1}
.dlg-choices button.ic svg{width:38px;height:38px;flex:none}
.app[data-kid="alfie"] .dlg-choices button.ic{min-width:78px;min-height:78px}
.app[data-kid="alfie"] .dlg-choices button.ic svg{width:46px;height:46px}
.dlg-choices button.sel{background:var(--btn-a);color:#1E2233;border-color:#1E2233}
.dlg-choices form{display:flex;gap:6px;width:100%}
.dlg-choices input{flex:1;min-width:0;min-height:48px;border-radius:10px;border:2px solid var(--dlg-edge);background:var(--raise);padding:6px 10px}

/* ---------- HUD ---------- */
.hud{grid-area:hud;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.hud-portrait{width:52px;height:52px;border-radius:12px;background:var(--shell-2);overflow:hidden;display:grid;place-items:center}
.hud-portrait svg{width:52px;height:52px;display:block}
.hud-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.hud-line b{font-family:var(--display);font-size:16px}
.hud-line .muted{color:var(--ink-2);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--shell-2);color:var(--ink-2);white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.meter{display:flex;flex-direction:column;gap:2px;min-width:0}
.meter span{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:99px;background:var(--shell-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.hudbook{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--shell-2);display:grid;place-items:center;padding:0}
.hudbook svg{width:34px;height:34px}
.mid #bookBtn{display:none}
.quest{margin-top:5px;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Control deck ---------- */
.deck{grid-area:deck;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:2px 0}
.dpad{justify-self:start;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button{background:var(--dpad);color:var(--dpad-ink);border:0;display:grid;place-items:center;touch-action:none;font-size:18px}
.dpad button:active,.dpad button.on{background:var(--dpad-hi)}
.dpad .u{grid-column:2;grid-row:1;border-radius:12px 12px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:12px 0 0 12px}
.dpad .c{grid-column:2;grid-row:2;background:var(--dpad);pointer-events:none}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 12px 12px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 12px 12px}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mid .pill-btn{min-width:0;width:100%;max-width:96px;padding:6px 8px;font-size:13px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mid .pill-btn svg{width:22px;height:22px;flex:none}
.pill-btn{min-height:48px;min-width:76px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-weight:800;font-size:13px;letter-spacing:.3px;font-family:var(--display)}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--shell);border-color:var(--ink)}
.ab{justify-self:end;display:grid;grid-template-columns:58px 58px;grid-template-rows:34px 58px;gap:0 8px;touch-action:none;user-select:none;-webkit-user-select:none}
.ab button{width:58px;height:58px;border-radius:50%;border:0;font-family:var(--display);font-weight:900;font-size:22px;color:var(--btn-ink);box-shadow:0 4px 0 rgba(0,0,0,.25);touch-action:none;position:relative}
.ab .a.hint{animation:apulse 1.1s ease-in-out infinite}
@keyframes apulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 0 rgba(255,122,26,.75)}55%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 13px rgba(255,122,26,0)}}
.abadge{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:#FFFBF3;border:2px solid #1E2233;display:grid;place-items:center;pointer-events:none}
.abadge svg{width:22px;height:22px}
.ab button:active,.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ab .b{grid-column:1;grid-row:2;background:var(--btn-b);color:#fff}
.ab .a{grid-column:2;grid-row:1 / span 2;align-self:start;background:var(--btn-a)}
.transport{display:none;grid-column:1 / -1;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.speeds{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--raise);padding:3px;gap:2px;justify-self:center}
.speeds button{border:0;background:transparent;min-height:48px;min-width:48px;border-radius:999px;font-weight:800;font-family:var(--display)}
.speeds button[aria-pressed="true"]{background:var(--ink);color:var(--shell)}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--btn-a);color:#1E2233;font-weight:900;font-size:13px;font-family:var(--display);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tstack{display:flex;flex-direction:column;gap:6px}
.app[data-mode="watch"] .dpad,.app[data-mode="watch"] .ab,.app[data-mode="watch"] .mid,
.app[data-mode="parent"] .dpad,.app[data-mode="parent"] .ab,.app[data-mode="parent"] .mid{display:none}
.app[data-mode="watch"] .transport,.app[data-mode="parent"] .transport{display:grid}

/* ---------- Panel (bottom sheet on phones, side panel when wide) ---------- */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:82dvh;display:flex;flex-direction:column;background:var(--raise);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px 2px 6px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 10px;min-height:48px;font-weight:800;color:var(--ink-2);white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:5px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tab .lock{width:14px;height:14px;opacity:.7}
.app.gate-open .tab .lock{display:none}
.tab.holding{background:linear-gradient(90deg,var(--accent-soft) var(--hold,0%),transparent var(--hold,0%))}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.close{border:1px solid var(--line);background:var(--shell);border-radius:10px;min-width:48px;min-height:48px;font-weight:800;align-self:flex-start}
.panel-body{overflow:auto;padding:4px 2px 16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:25}
.card{background:var(--shell);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h3{font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hint{font-size:12.5px;color:var(--ink-2);margin:0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--shell-2);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 12px;min-height:48px;font-weight:800}
.btn.primary{background:var(--ink);color:var(--shell);border-color:var(--ink)}
.btn.warn{color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 10px;min-height:48px;color:var(--ink);font-size:15px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.toggle input{width:22px;height:22px;flex:none;margin-top:1px}
.toggle small{display:block;color:var(--ink-2);font-size:12.5px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.list li .t{color:var(--ink-2);font-variant-numeric:tabular-nums;margin-right:6px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-2);font-size:12px;font-weight:800}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:800;text-align:inherit;min-height:32px}
td.best{color:var(--good);font-weight:800}
tbody td:first-child{white-space:nowrap}
td.worst{color:var(--crit)}
.petcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.petcard .portrait{width:96px;height:96px;border-radius:16px;background:var(--shell-2);overflow:hidden}
.petcard .portrait svg{width:96px;height:96px;display:block}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;align-items:center}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13px}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dotted var(--line)}
.log .t{color:var(--ink-2);font-variant-numeric:tabular-nums}
.log .k-nudge,.log .k-flag,.log .k-miss,.log .k-robot{color:var(--crit)}
.log .k-done,.log .k-confirm,.log .k-grow,.log .k-friend{color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:1px}
.scencard{display:flex;flex-direction:column;gap:6px}
.scencard.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.progress{height:10px;border-radius:99px;background:var(--shell-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.friend{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;font-weight:700}
.friend .pic{width:56px;height:56px;margin:0 auto 4px;display:grid;place-items:center}
.friend .pic svg{width:56px;height:56px}
.friend.locked{opacity:.45}

/* ---------- Encounter layer, modal, toast ---------- */
.encounter{position:fixed;inset:0;z-index:40;background:var(--shell);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#encounterMount{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.fbq{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;max-width:640px;width:100%;margin:0 auto;justify-content:center}
.fbq .stage{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:linear-gradient(var(--accent-soft),var(--shell-2));border-radius:18px;padding:14px}
.fbq .stage svg{width:110px;height:110px}
.fbq .q{font-family:var(--display);font-size:22px;font-weight:800;text-align:center}
.fbq .pic{font-size:30px;text-align:center;letter-spacing:4px}
.fbq .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fbq .opts button{min-height:64px;border-radius:16px;border:3px solid var(--ink);background:var(--raise);font-family:var(--display);font-size:20px;font-weight:800}
.fbq .opts button.right{background:var(--good-soft);border-color:var(--good)}
.fbq .opts button.wrong{opacity:.5}
.fbq .meterline{display:flex;gap:6px;justify-content:center}
.fbq .meterline i{width:22px;height:10px;border-radius:9px;background:var(--line)}
.fbq .meterline i.on{background:var(--good)}
.fbq .say{text-align:center;font-weight:700;min-height:1.4em}
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-height:560px){.modal{align-items:center}}
.sheet{background:var(--raise);color:var(--ink);border-radius:20px;border:1px solid var(--line);max-width:560px;width:100%;max-height:88dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:22px}
.toast{position:absolute;left:8px;right:8px;margin:0 auto;width:fit-content;bottom:10px;background:rgba(30,34,51,.94);color:#FFF4E0;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:6;max-width:92%;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;pointer-events:none}
.toast svg{width:30px;height:30px;flex:none;background:#FFFBF3;border-radius:8px;padding:2px}
.screen-inner.dlg-on .toast{bottom:auto;top:62px}
.toast.float{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;z-index:70}
/* Picture quest strip (play mode): today's jobs as pictures. Tap one to hear it. */
.qstrip{position:absolute;left:8px;top:8px;display:flex;gap:5px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;padding:3px;z-index:3;-webkit-overflow-scrolling:touch}
.qstrip::-webkit-scrollbar{display:none}
.qbtn{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid rgba(30,34,51,.9);background:rgba(255,251,243,.94);display:grid;place-items:center;padding:0;position:relative;touch-action:manipulation}
.qbtn svg{width:34px;height:34px}
.qbtn.done{background:rgba(221,241,227,.94)}.qbtn.done svg{opacity:.55}
.qbtn.later svg{opacity:.8}
.qbtn.missed{opacity:.45}
.qbtn.now{border-color:#FF7A1A;box-shadow:0 0 0 3px rgba(255,122,26,.5);animation:qpulse 1.3s ease-in-out infinite}
.qbtn.active{border-color:#2F6FD1}
.qbtn .tick{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#2E7D4F;display:grid;place-items:center;border:2px solid #FFFBF3}
.qbtn .tick svg{width:12px;height:12px}
.qbtn.pop{animation:qpop .35s ease-out}
@keyframes qpulse{50%{transform:scale(1.09)}}
@keyframes qpop{40%{transform:scale(1.18)}}

/* ---------- Landscape phones: controls either side ---------- */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-columns:minmax(150px,1fr) minmax(0,auto) minmax(150px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"dm top dr" "dl screen dr" "dl screen dr";gap:6px 10px;padding-block:6px}
  .screen{aspect-ratio:4/3;height:100%;max-width:calc(100vw - 360px);justify-self:center}
  .top{justify-content:center}
  .brand span{display:none}
  .hud{display:none}
  .deck{display:contents}
  .dpad{grid-area:dl;align-self:end;justify-self:center;margin-bottom:6px}
  .ab{grid-area:dr;align-self:center;justify-self:center}
  .mid{grid-area:dm;flex-direction:row;justify-content:center;flex-wrap:wrap;align-self:start}
  .mid .pill-btn{max-width:72px;padding:4px 6px;font-size:12px}
  .mid .pill-btn .lbl{display:none}
  .mid #bookBtn{display:inline-flex}
  .dialog{max-height:84%;padding:6px 8px;gap:6px;left:6px;right:6px;bottom:6px}
  .dlg-portrait,.dlg-portrait svg{width:40px;height:40px}
  .dlg-text{font-size:14.5px}
  .dlg-choices{gap:4px;margin-top:4px}
  .dlg-choices button.ic,.app[data-kid="alfie"] .dlg-choices button.ic{min-width:54px;min-height:54px;padding:3px 5px;font-size:10.5px}
  .dlg-choices button.ic svg,.app[data-kid="alfie"] .dlg-choices button.ic svg{width:28px;height:28px}

  .transport{grid-area:dr;grid-template-columns:1fr;justify-items:center;align-self:center}
  .app[data-mode="watch"] .transport,.app[data-mode="parent"] .transport{display:grid}
  .tstack{flex-direction:row}
  .modes button{padding:4px 8px;min-height:44px}
}
/* ---------- Wide screens: side panel always visible ---------- */
@media (min-width:1000px) and (min-height:600px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top panel" "screen panel" "hud panel" "deck panel";gap:10px 18px;padding-block:14px}
  .panel{grid-area:panel;position:static;transform:none;max-height:none;min-height:0;border:1px solid var(--line);border-radius:18px;box-shadow:none;transition:none;padding:0 12px}
  .panel .close,.panel .grab{display:none}
  .scrim{display:none!important}
  .menu-btn-label{display:none}
}
@media (max-width:460px){.brand div{display:none}.modes button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){.dlg-next{animation:none}.panel{transition:none}.qbtn.now,.qbtn.pop{animation:none}.ab .a.hint{animation:none;box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 5px #FFD166}}
/* Compare and Assumptions */
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px dotted var(--line)}
.arow label{font-size:13.5px;font-weight:650}
.arow output{font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px;white-space:nowrap}
.arow input[type=range]{grid-column:1/-1;width:100%;min-height:36px;accent-color:var(--accent);margin:0}
.arow .src{grid-column:1/-1;font-size:12px;color:var(--ink-2);margin:0}
.arow.changed output{color:var(--accent)}
.agroup{font-family:var(--display);font-size:14px;margin:10px 0 0;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
details.assume>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font-family:var(--display);font-weight:800;font-size:16px}
details.assume>summary::-webkit-details-marker{display:none}
details.assume>summary::after{content:"Show";font-family:var(--body);font-size:13px;font-weight:800;color:var(--accent)}
details.assume[open]>summary::after{content:"Hide"}
.bodytab input{width:64px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);padding:4px 6px;font-size:14px}
.ctable td .r{display:block;font-size:11px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{position:sticky;left:0;background:var(--shell);z-index:1}
.ctable tr.base td,.ctable tr.base td:first-child{background:var(--shell-2)}
.findings{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.stale{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.tablewrap.scrolls{box-shadow:inset -14px 0 10px -10px rgba(0,0,0,.25)}
.rep td,.rep th{padding:5px 6px}
.hearts{color:#E2537A;letter-spacing:1px;white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app" data-mode="watch">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="2" width="10" height="10" fill="#B9541F"/><rect x="2" y="4" width="12" height="7" fill="#B9541F"/><rect x="4" y="4" width="8" height="7" fill="#F4A940"/><rect x="5" y="6" width="1" height="2" fill="#2B1D16"/><rect x="10" y="6" width="1" height="2" fill="#2B1D16"/><rect x="7" y="8" width="2" height="1" fill="#5A2E22"/><rect x="6" y="9" width="4" height="2" fill="#FFE8C4"/><rect x="5" y="12" width="6" height="2" fill="#F4A940"/></svg>
      <div><b>Kindlings</b><span> Home Twin</span></div>
    </div>
    <div class="modes" role="group" aria-label="Who is playing" id="modes">
      <button type="button" data-mode="watch" aria-pressed="true">Watch</button>
      <button type="button" data-mode="alfie" id="mode_alfie">Alfie</button>
      <button type="button" data-mode="ruby" id="mode_ruby">Ruby</button>
      <button type="button" data-mode="parent">Parent</button>
    </div>
  </header>

  <section class="screen" aria-label="Game screen">
    <div class="screen-inner" id="screenInner">
      <canvas id="game" aria-label="Top-down view of the family home and garden"></canvas>
      <div class="qstrip" id="qstrip" role="group" aria-label="Today's jobs. Tap a picture to hear it." hidden></div>
      <div class="hud-top">
        <span class="chip" id="clockChip">Mon 07:00</span>
        <button class="chip scen" type="button" id="scenChip">Normal school day</button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="dialog" id="dialog" hidden aria-live="polite">
        <div class="dlg-portrait" id="dlgPortrait"></div>
        <div>
          <div class="dlg-name" id="dlgName"></div>
          <p class="dlg-text" id="dlgText"></p>
          <div class="dlg-choices" id="dlgChoices"></div>
        </div>
        <span class="dlg-next" id="dlgNext" hidden aria-hidden="true">&#9660;</span>
      </div>
      <div class="toast" id="toast" hidden role="status"></div>
    </div>
  </section>

  <section class="hud" id="hud" aria-label="Pet status">
    <div class="hud-portrait" id="hudPortrait"></div>
    <div style="min-width:0">
      <div class="hud-line"><b id="hudName">Roary</b><span class="muted" id="hudStage">Cub</span><span class="tag" id="hudBody">Desk robot</span></div>
      <div class="meters" id="hudMeters"></div>
      <div class="quest" id="hudQuest"></div>
    </div>
    <button type="button" class="hudbook" id="hudBook" aria-label="Friend Book"></button>
  </section>

  <nav class="deck" id="deck" aria-label="Controls">
    <div class="dpad" id="dpad" aria-label="Move">
      <button type="button" class="u" data-dir="up" aria-label="Up">&#9650;</button>
      <button type="button" class="l" data-dir="left" aria-label="Left">&#9664;</button>
      <span class="c"></span>
      <button type="button" class="r" data-dir="right" aria-label="Right">&#9654;</button>
      <button type="button" class="d" data-dir="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="mid">
      <button type="button" class="pill-btn" id="bookBtn" aria-label="Friend Book"><span id="bookIc" aria-hidden="true"></span><span class="lbl">Friends</span></button>
      <button type="button" class="pill-btn" id="menuBtn" aria-haspopup="dialog">Menu</button>
      <button type="button" class="pill-btn" id="speedBtn" aria-label="Change speed">1x</button>
      <button type="button" class="pill-btn" id="skipBtnPlay" title="Skip to the next pet moment">Skip</button>
    </div>
    <div class="ab">
      <button type="button" class="b" id="btnB" aria-label="B: back">B</button>
      <button type="button" class="a" id="btnA" aria-label="A: talk or choose">A<span class="abadge" id="aBadge" hidden></span></button>
    </div>
    <div class="transport">
      <div class="tstack">
        <button type="button" class="pill-btn" id="camBtn">Camera</button>
        <button type="button" class="pill-btn" id="menuBtn2">Menu</button>
      </div>
      <div class="tstack" style="align-items:center">
        <div class="speeds" role="group" aria-label="Speed" id="speeds">
          <button type="button" data-speed="1" aria-pressed="true">1x</button>
          <button type="button" data-speed="4">4x</button>
          <button type="button" data-speed="16">16x</button>
        </div>
        <button type="button" class="pill-btn" id="skipBtn" title="Skip ahead to the next time a pet talks">Next pet moment</button>
      </div>
      <button type="button" class="play" id="playBtn">Play</button>
    </div>
  </nav>

  <aside class="panel" id="panel" aria-label="Twin panel">
    <div class="grab" aria-hidden="true"></div>
    <div class="panel-head">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
        <button class="tab" role="tab" data-tab="pets" aria-selected="false">Pets</button>
        <button class="tab" role="tab" data-tab="friends" aria-selected="false">Friend Book</button>
        <button class="tab" role="tab" data-tab="scenarios" data-gate="1" aria-selected="false">Scenarios</button>
        <button class="tab" role="tab" data-tab="compare" data-gate="1" aria-selected="false">Compare</button>
        <button class="tab" role="tab" data-tab="parent" data-gate="1" aria-selected="false">Parent</button>
        <button class="tab" role="tab" data-tab="log" data-gate="1" aria-selected="false">Log</button>
      </div>
      <button class="close" type="button" id="panelClose" aria-label="Close panel">&#10005;</button>
    </div>
    <div class="panel-body" id="panelBody" role="tabpanel"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="encounter" id="encounterLayer" hidden><div id="encounterMount"></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="sheet" id="modalSheet"></div></div>

<script>
"use strict";
/* =====================================================================
   Kindlings Home Twin
   A phone-first, top-down digital twin of the family home. The engine
   (Sim) is DOM-free so Compare can run many simulated weeks headless.
   Optional modules: window.PetArt (pet-art.js) and window.Challenges
   (challenges.js). Both have fallbacks below.
   Names the player sees come from FAMILY (edited in Parent > Names and
   saved to localStorage "kindlings.family"). Internal ids stay fixed.
   ===================================================================== */

// ---------------------------------------------------------------------
// FAMILY CONFIG (runtime names; never hard-code a name inside a sentence)
// ---------------------------------------------------------------------
const FAMILY_DEFAULTS = { kids: { alfie: 'Alfie', ruby: 'Ruby', theo: 'Theo' }, pets: { lion: 'Roary', panda: 'Bao' }, parents: { mum: 'Mum', dad: 'Dad' } };
const FAMILY_KEY = "kindlings.family";
const SAVE_KEY = "kindlings.twin.v1";
function loadFamily(){
  const f=JSON.parse(JSON.stringify(FAMILY_DEFAULTS));
  try{
    const s=localStorage.getItem(FAMILY_KEY);
    if(s){const o=JSON.parse(s);for(const g of ["kids","pets","parents"])if(o&&o[g])for(const k of Object.keys(f[g])){const v=o[g][k];if(typeof v==="string"&&v.trim())f[g][k]=v.trim().slice(0,24);}}
  }catch(e){}
  return f;
}
let FAMILY=loadFamily();
function familySaved(){try{return localStorage.getItem(FAMILY_KEY)!==null;}catch(e){return true;}}
function saveFamily(){try{localStorage.setItem(FAMILY_KEY,JSON.stringify(FAMILY));}catch(e){}}
const FIXED_NAMES={grandma:"Grandma",grandpa:"Grandpa"};
function nm(id){return FAMILY.kids[id]||FAMILY.pets[id]||FAMILY.parents[id]||FIXED_NAMES[id]||String(id);}
function poss(name){return name+"'s";}
function T(s){return String(s).replace(/\{([a-z_]+)\}/g,(m,k)=>nm(k));}
function parentsPhrase(){return `${nm("mum")} or ${nm("dad")}`;}

// ---------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtTime=m=>{m=((Math.floor(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const parseTime=s=>{const p=String(s).split(":").map(Number);return (p[0]||0)*60+(p[1]||0);};
const pickR=(arr,rng)=>arr[Math.floor(rng()*arr.length)];
function shuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let UID=1;const uid=()=>UID++;
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const dayName=d=>DAYS[(d-1)%7];
const isWeekendDay=d=>(d-1)%7>=5;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const lowerLabel=l=>/^iPad/.test(l)?l:l[0].toLowerCase()+l.slice(1);
const listJoin=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
function hash2(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}

// ---------------------------------------------------------------------
// MAP (46 x 32 tiles of 16 px). House top-left, garden right, front yard below.
// ---------------------------------------------------------------------
const TILE=16, MW=46, MH=32;
const ROOMS=[
  {id:"alfie",x0:1,y0:1,x1:8,y1:7,floor:"wood",paper:"#9CC7E8"},
  {id:"ruby",x0:10,y0:1,x1:17,y1:7,floor:"lav",paper:"#C9B8EE"},
  {id:"bath",x0:19,y0:1,x1:23,y1:7,floor:"tile",paper:"#BFE3EA"},
  {id:"parents",x0:25,y0:1,x1:30,y1:7,floor:"beige",paper:"#E8D6BE"},
  {id:"hall",x0:1,y0:9,x1:30,y1:10,floor:"hall",paper:"#E9DCC6"},
  {id:"living",x0:1,y0:12,x1:15,y1:19,floor:"moss",paper:"#CFE0B5"},
  {id:"kitchen",x0:17,y0:12,x1:30,y1:19,floor:"check",paper:"#F2DFB8"},
  {id:"shed",x0:39,y0:21,x1:42,y1:23,floor:"plank",paper:"#C99B6B"}
];
function roomName(id){
  if(id==="alfie"||id==="ruby")return poss(nm(id))+" room";
  return ({bath:"Bathroom",parents:"Parents' room",hall:"Hallway",living:"Living room",kitchen:"Kitchen",shed:"Workshop shed",garden:"Garden",front:"Front garden"})[id]||"House";
}
function roomPhrase(id){if(id==="alfie"||id==="ruby")return roomName(id);return "the "+roomName(id).toLowerCase();}
const INDOOR=new Set(["alfie","ruby","bath","parents","hall","living","kitchen"]);
const DOORS=[[4,8],[5,8],[13,8],[14,8],[21,8],[27,8],[7,11],[8,11],[23,11],[24,11],[16,15],[16,16],[31,15],[31,16],[4,20],[5,20],[40,20],[41,20]];
const DOORSET=new Set(DOORS.map(d=>d[0]+","+d[1]));
const OUT_DOORS=new Set(["31,15","31,16","4,20","5,20","40,20","41,20"]);
const FURN=[
  {k:"bed",x:1,y:1,w:2,h:3,owner:"alfie"},{k:"stand",x:3,y:1,w:1,h:1,id:"alfie_stand"},{k:"wardrobe",x:7,y:1,w:2,h:1},{k:"toybox",x:7,y:6,w:2,h:1},
  {k:"bed",x:10,y:1,w:2,h:3,owner:"ruby"},{k:"stand",x:12,y:1,w:1,h:1,id:"ruby_stand"},{k:"desk",x:15,y:1,w:3,h:1},{k:"books",x:17,y:3,w:1,h:3},{k:"wardrobe",x:10,y:7,w:2,h:1},

  setupAdults(sc){

  setupPetDay(pet,sc){

  enqueue(pet,o){

  // ----- main step -----
  step(dt){
    if(this.dayEnded)return;
    if(this.waitingUser())return;
    this.t+=dt;
    while(this.evIdx<this.events.length&&this.events[this.evIdx].t<=this.t)this.events[this.evIdx++].fn();
    if(this.squabbling&&this.t>this.squabbling)this.squabbling=0;
    for(const kid of Object.values(this.kids))this.updateKid(kid,dt);
    for(const a of Object.values(this.adults))this.updateAdult(a,dt);
    for(const pet of Object.values(this.pets))this.updatePet(pet,dt);
    if(this.pjobs.length)this.runParentJobs();
    if(this.talks.size){const tl=this.talkList;tl.length=0;for(const t of this.talks)tl.push(t);for(const talk of tl)this.advanceTalk(talk);}
    this.updateConfirm();
    this.checkNight();
    if(!this.headless&&this.fx.length){for(const p of this.fx){p.life-=dt*1.2;}this.fx=this.fx.filter(p=>p.life>0);}
  }
  // ----- kids -----
  blockAt(kid,t){return kid.blocks.find(b=>t>=b.s&&t<b.e)||null;}

    if(blk!==kid.block){const prev=kid.block;kid.block=blk;kid.blockArrived=false;this.blockChanged(kid,prev,blk);}

    if(kid.asleep)return;
    if(kid.leaving){if(!kid.path.length){kid.away=true;kid.leaving=false;const pet=this.pets[kid.petId];if(this.bodyDef(pet).kind==="plush"&&pet.carried){pet.carried=false;this.place(pet,kid.bedside);}if(this.body(pet)==="core"&&pet.carried){pet.carried=false;this.place(pet,this.homeSpot(pet));}}return;}

      else if(d.phase==="perform"&&t>=d.until){kid.doing=null;d.onDone();}
      return;
    }
    if(kid.talking)return;
    if(blk&&blk.spot){if(!kid.blockArrived&&!kid.path.length){if(this.atSpot(kid,blk.spot))kid.blockArrived=true;else if(!this.walkTo(kid,blk.spot))kid.blockArrived=true;}return;}

      this.walkTo(kid,this.wanderTarget(kid));kid.wanderAt=t+12+this.rng()*18;

  }
  wanderTarget(kid){

  complyP(kid,pet,factor,presence,tries,session){

  lineDur(text){return .04+String(text).length*.0012;}
  advanceTalk(talk){

      if(talk.cancel||talk.i>=talk.steps.length){this.endTalk(talk);return;}

// One seed's run (a list of day reports) becomes one value per measure. Compare then shows the mean and the range across seeds.
function summarise(reports,A){
  A=A||defaultAssume();
  const a={asked:0,done:0,onTime:0,prompts:0,parentPrompts:0,nudges:0,learnQ:0,learnRight:0,petMin:0,capMin:0,capHit:0,overCap:0,screenMin:0,wind:0,windN:0,invites:0,accepted:0,visits:0,misheard:0,unreachable:0,doorBlocks:0,flat:0,stuck:0,friends:0,days:0};
  const weekVisits=[];
  reports.forEach((r,i)=>{a.days++;const w=Math.floor(i/7);weekVisits[w]=(weekVisits[w]||0);
    for(const k of ["alfie","ruby"]){const m=r.kids[k];
      a.asked+=m.asked;a.done+=m.done;a.onTime+=m.onTime;a.prompts+=m.prompts;a.parentPrompts+=m.parentPrompts||0;a.nudges+=m.nudges;a.learnQ+=m.learnQ;a.learnRight+=m.learnRight;
      a.petMin+=m.petMin;a.capMin+=m.capMin||0;a.capHit+=m.capHit||0;a.overCap+=m.overCap||0;a.screenMin+=m.screenMin;
      if(m.windLatency!=null){a.wind+=m.windLatency;a.windN++;}
      a.invites+=m.invites;a.accepted+=m.accepted;a.visits+=m.visits;weekVisits[w]+=m.visits;a.misheard+=m.misheard;a.unreachable+=m.unreachable;a.doorBlocks+=m.doorBlocks||0;a.friends+=m.befriended;}
    for(const p of ["lion","panda"]){a.flat+=r.pets[p].flat;a.stuck+=r.pets[p].stuck||0;}
  });
  const d=Math.max(1,a.days);
  // Weekly visits: scale a part week up to seven days so short runs are comparable.
  const wv=weekVisits.map((v,i)=>{const n=Math.min(7,reports.length-i*7);return n>0?v*7/n:0;});
  return{
    load:(a.parentPrompts*A.minReminder+a.nudges*A.minStepIn+a.flat*A.minFix)/d,parentPrompts:a.parentPrompts/d,nudges:a.nudges/d,flat:a.flat/d,
    completion:a.asked?100*a.done/a.asked:0,onTime:a.asked?100*a.onTime/a.asked:0,prompts:a.asked?a.prompts/a.asked:0,
    wind:a.windN?a.wind/a.windN:0,accuracy:a.learnQ?100*a.learnRight/a.learnQ:null,learnQ:a.learnQ/(2*d),
    petMin:a.petMin/(2*d),capDays:100*a.capHit/(2*d),overCap:a.overCap/(2*d),screen:a.screenMin/(2*d),
    engagement:a.invites?100*a.accepted/a.invites:null,visits:a.visits/d,
    visitsW1:wv[0]||0,visitsLast:wv.length>1?wv[wv.length-1]:(wv[0]||0),
    misheard:a.misheard/d,unreachable:a.unreachable/d,doorBlocks:a.doorBlocks/d,stuck:a.stuck/d,friendsWeek:a.friends/d*7,
    weekVisits:wv
  };
}

  {k:"flat",label:"Hardware fixes / day",note:"flat batteries, stuck robots",fmt:v=>v.toFixed(1),dir:-1,key:1},
  {k:"completion",label:"Habits completed",fmt:v=>v.toFixed(0)+"%",dir:1,key:1},
  {k:"onTime",label:"Done without stepping in",fmt:v=>v.toFixed(0)+"%",dir:1},
  {k:"prompts",label:"Reminders per habit",note:"pet and grown-up",fmt:v=>v.toFixed(2),dir:-1},

// Mean and range across seeds for every measure.
function aggregate(perSeed){
  const out={n:perSeed.length,weekVisits:[]};
  for(const mt of METRICS){
    const vals=perSeed.map(s=>s[mt.k]).filter(v=>v!=null&&isFinite(v));
    out[mt.k]=vals.length?{mean:vals.reduce((x,y)=>x+y,0)/vals.length,min:Math.min(...vals),max:Math.max(...vals)}:{mean:null,min:null,max:null};
  }
  const W=Math.max(0,...perSeed.map(s=>s.weekVisits.length));
  for(let w=0;w<W;w++){const v=perSeed.map(s=>s.weekVisits[w]).filter(x=>x!=null);out.weekVisits.push(v.length?v.reduce((x,y)=>x+y,0)/v.length:0);}

}
const COMPARE_STEP=.5;
function runTrialDays(cfg,scenarioId,days,seed){

// Runs one simulated day of a trial; returns true when the trial is finished.
function stepTrialDay(tr){
  const s=tr.sim;let guard=0;while(!s.dayEnded&&guard<40000){s.step(COMPARE_STEP);guard++;}

  if(tr.day>=tr.days)return true;
  s.nextDay();return false;
}
// Plain-language findings from the numbers, always measured against "No pet".
function compareFindings(R,scen){
  const res=R.byScen[scen];if(!res)return [];
  const out=[],base=res.none,M=k=>METRICS.find(m=>m.k===k);
  const val=(b,k)=>res[b]&&res[b][k]&&res[b][k].mean;
  const rng=(b,k)=>{const x=res[b][k];return x&&x.mean!=null?`${M(k).fmt(x.mean)} (${M(k).fmt(x.min)} to ${M(k).fmt(x.max)})`:"–";};
  const pets=COMPARE_BODIES.filter(b=>b!=="none"&&res[b]);
  if(base){
    const byLoad=pets.slice().sort((a,b)=>val(a,"load")-val(b,"load"));
    const best=byLoad[0],next=byLoad[1],worst=byLoad[byLoad.length-1];
    const cut=v=>Math.round(100*(1-v/Math.max(.01,val("none","load"))));
    out.push(`Without a pet, grown-ups spend ${rng("none","load")} minutes a day on reminders and stepping in. ${BODIES[best].label} cuts that most: ${rng(best,"load")}, about ${cut(val(best,"load"))}% less.`);
    if(next){const ov=res[best].load.max>=res[next].load.min;out.push(ov?`${BODIES[best].label} and ${BODIES[next].label} overlap across runs (${rng(next,"load")}), so the gap between them is within run-to-run noise.`:`${BODIES[best].label} beats ${BODIES[next].label} (${rng(next,"load")}) in every run.`);}
    const worse=pets.filter(b=>res[b].load.min>res.none.load.max),noBetter=pets.filter(b=>!worse.includes(b)&&val(b,"load")>=val("none","load")*.95);
    if(worse.length)out.push(`${listJoin(worse.map(b=>BODIES[b].label))} ${worse.length>1?"leave":"leaves"} grown-ups with more to do than no pet at all, in every run.`);
    if(noBetter.length)out.push(`${listJoin(noBetter.map(b=>`${BODIES[b].label} (${rng(b,"load")})`))} ${noBetter.length>1?"save":"saves"} grown-ups little or no time compared with no pet.`);
    else if(!worse.length&&worst)out.push(`Smallest saving: ${BODIES[worst].label}, ${rng(worst,"load")}.`);
    const cd=pets.map(b=>val(b,"completion")-val("none","completion"));
    out.push(`Habits completed: no pet ${rng("none","completion")}; with a pet ${Math.round(Math.min(...pets.map(b=>val(b,"completion"))))}% to ${Math.round(Math.max(...pets.map(b=>val(b,"completion"))))}% (${cd.every(x=>Math.abs(x)<3)?"about the same: grown-ups still get habits done":"the pet changes how many get done"}).`);
  }
  const fix=pets.filter(b=>val(b,"flat")>=.3).sort((a,b)=>val(b,"flat")-val(a,"flat"));
  if(fix.length)out.push(`Hardware costs grown-up time: ${fix.map(b=>`${BODIES[b].label} ${rng(b,"flat")} fixes a day`).join(", ")}${val("robot","doorBlocks")>.05?`; shut doors stop the robot ${M("doorBlocks").fmt(val("robot","doorBlocks"))} times a day`:""}.`);
  const mis=pets.slice().sort((a,b)=>val(b,"misheard")-val(a,"misheard"))[0];
  if(mis&&val(mis,"misheard")>.5)out.push(`Most misheard replies: ${BODIES[mis].label}, ${rng(mis,"misheard")} a day. Toddler speech is the weak link wherever there is no button or screen to tap.`);
  const capped=pets.filter(b=>val(b,"capDays")>0);
  out.push(capped.length?`The daily cap was reached on ${capped.map(b=>`${M("capDays").fmt(val(b,"capDays"))} of child-days with ${BODIES[b].label}`).join(", ")}; the pet then said goodbye and only helped with routines${pets.some(b=>val(b,"overCap")>.05)?`, with at most ${M("overCap").fmt(Math.max(...pets.map(b=>val(b,"overCap"))))} min a day over from habit reminders`:""}.`:"No body reached the daily pet-time cap in these runs.");
  if(R.weeks>=3){
    const drops=pets.map(b=>{const w=res[b].weekVisits;return{b,w1:w[0]||0,w3:w[Math.min(2,w.length-1)]||0,last:w[w.length-1]||0};}).filter(x=>x.w1>0);
    if(drops.length){const avg=drops.reduce((s,x)=>s+(1-x.w3/x.w1),0)/drops.length;const top=drops.slice().sort((a,b)=>(b.w1-b.w3)-(a.w1-a.w3))[0];
      out.push(`Week-3 novelty effect: child-started visits fall by about ${Math.round(100*avg)}% from week 1 to week 3 on average; the biggest drop is ${BODIES[top.b].label} (${top.w1.toFixed(1)} to ${top.w3.toFixed(1)} a week). Judge bodies on weeks 3 to ${R.weeks}, not week 1.`);}
  }
  return out;
}
function compareCSV(R){

  for(const sc of Object.keys(R.byScen))for(const b of COMPARE_BODIES){const x=R.byScen[sc][b];if(!x)continue;
    for(const mt of METRICS){const v=x[mt.k];rows.push([scenarioById(sc).name(),BODIES[b].label,mt.label,v.mean==null?"":+v.mean.toFixed(3),v.min==null?"":+v.min.toFixed(3),v.max==null?"":+v.max.toFixed(3),x.n,R.weeks]);}

}

}

  const topPad=(playing?66:44)*DPR/cam.s;

const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function playerKid(){return (mode==="alfie"||mode==="ruby")?sim.kids[mode]:null;}
function canPlayerMove(k){return k&&!dlg.choice&&k.takeover&&!k.asleep&&!k.away&&!k.leaving&&!k.talking&&!k.doing&&!(k.block&&(k.block.spot||k.block.act==="waking"))&&!k.path.length&&!sim.waitingUser()&&!encounterOpen&&!dlg.local&&!sim.dayEnded;}
function heldDir(){for(let i=input.order.length-1;i>=0;i--){const d=input.order[i];if(input.held[d])return d;}return null;}
function updatePlayer(dt){
  const k=playerKid();if(!k)return;
  if(player.moving){
    player.prog+=dt*5.5;
    if(player.prog>=1){k.x=player.tx+.5;k.y=player.ty+.5;player.moving=false;k.anim=(k.anim||0)+.5;const prev=sim.trackZone(k);if(prev!==null)sim.onZoneChange(k,prev,k.zone);}
    else{k.x=player.fx+.5+(player.tx-player.fx)*player.prog;k.y=player.fy+.5+(player.ty-player.fy)*player.prog;k.anim=(k.anim||0)+dt*5.5*.5;return;}
  }
  if(!canPlayerMove(k)){player.path=[];player.pending=null;return;}
  // A very quick tap on the D-pad still moves one step (it is queued on pointer-down).
  const d=heldDir()||player.pending;player.pending=null;
  const cx=Math.floor(k.x),cy=Math.floor(k.y);
  let nx=null,ny=null;
  if(d){player.path=[];k.dir=d;const v=DIRV[d];nx=cx+v[0];ny=cy+v[1];}
  else if(player.path.length){[nx,ny]=player.path.shift();const dx=nx-cx,dy=ny-cy;k.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");}
  if(nx===null)return;
  if(!walkable(nx,ny,"walk")){player.path=[];return;}
  player.moving=true;player.fx=cx;player.fy=cy;player.tx=nx;player.ty=ny;player.prog=0;
}

// Standing in the pet corner (by the pond) lets the player visit the puzzle friends who live there.
const INTERACT_CORNER=new Set();for(let y=9;y<=12;y++)for(let x=34;x<=38;x++)INTERACT_CORNER.add(x+","+y);
function sayLine(key,kidId,who,petId){const l=LN(key,kidId);localSay(l.text,who||"narr",petId||kidId,l.voice);}
// What the player can use right now: the thing in front first, then the pet on any side, then the other sides.
function findInteract(k){
  const cx=Math.floor(k.x),cy=Math.floor(k.y),pet=sim.pets[k.petId],b=sim.bodyDef(pet),face=k.dir||"down";
  const order=[face,...["down","up","left","right"].filter(d=>d!==face)];
  const other=sim.kids[k.id==="alfie"?"ruby":"alfie"];
  const pt=b.kind==="none"?null:b.kind==="fixed"?STANDS[sim.anchorSpot(pet)]:[Math.floor(pet.x),Math.floor(pet.y)];
  const at=(d,withPet)=>{
    const v=DIRV[d],fx=cx+v[0],fy=cy+v[1];
    if(withPet&&pt&&!pet.carried&&pt[0]===fx&&pt[1]===fy)return{type:"pet",dir:d};
    for(const a of Object.values(sim.adults))if(a.present&&!a.asleep&&Math.floor(a.x)===fx&&Math.floor(a.y)===fy)return{type:"adult",a,dir:d};
    if(!other.away&&!other.asleep&&Math.floor(other.x)===fx&&Math.floor(other.y)===fy)return{type:"sib",other,dir:d};
    const key=fx+","+fy;
    const it=INTERACT.find(i=>i.tiles.has(key)&&(!i.owner||i.owner===k.id))||INTERACT.find(i=>i.tiles.has(key));
    return it?{type:"obj",it,dir:d}:null;
  };
  const front=at(face,true);if(front)return front;
  if(pt){
    if(pet.carried)return{type:"pet",dir:null};
    for(const d of order){const v=DIRV[d];if(pt[0]===cx+v[0]&&pt[1]===cy+v[1])return{type:"pet",dir:d};}
    if(b.kind!=="fixed"&&Math.hypot(pet.x-k.x,pet.y-k.y)<1.6)return{type:"pet",dir:null};
  }
  for(const d of order.slice(1)){const r=at(d,false);if(r)return r;}
  if(TER[cy]&&TER[cy][cx]==="sand")return{type:"sand",dir:null};
  if(INTERACT_CORNER.has(cx+","+cy))return{type:"obj",it:INTERACT.find(i=>i.act==="critters"),dir:null};
  return null;
}
function interact(){
  const k=playerKid();if(!k||!canPlayerMove(k)){if(k&&k.doing)sayLine("narr.busy",k.id);return;}
  const f=findInteract(k),pet=sim.pets[k.petId];
  if(!f){sayLine("narr.nothing",k.id);return;}
  if(f.dir)k.dir=f.dir;
  if(f.type==="pet"){
    if(pet.asleep){sayLine("narr.pet_asleep",k.id);return;}
    if(pet.dead){sayLine("narr.pet_flat",k.id);return;}
    if(sim.bodyDef(pet).kind==="plush"&&!pet.carried){pet.carried=true;sayLine("narr.pickup",k.id);return;}
    if(pet.talk||(pet.job&&pet.job.phase==="talking")){sayLine("narr.pet_busy",k.id);return;}
    petChat(k,pet);return;
  }
  if(f.type==="adult"){adultTalk(f.a,k);return;}
  if(f.type==="sib"){const l=LN("child.sib_chat."+f.other.id,f.other.id);localSay(l.text,"child",f.other.id,l.voice);return;}
  if(f.type==="obj"){objectAction(k,f.it);return;}
  if(f.type==="sand"){sayLine("narr.sand",k.id);pet.joy=Math.min(100,pet.joy+1);}
}
// The A button pulses (with a small picture of what it will do) whenever pressing it does something.
function aHint(){
  const k=playerKid();if(!k||encounterOpen||!sim)return null;
  if(dlg.choice)return null;
  if(dlg.waitAck||dlg.local)return "next";
  if(!canPlayerMove(k))return null;
  const f=findInteract(k);if(!f)return null;
  if(f.type==="pet"){const pet=sim.pets[k.petId];return pet.asleep||pet.dead?null:"chat";}
  if(f.type==="adult"||f.type==="sib")return "chat";
  if(f.type==="obj"){
    const act=f.it.act;
    if(ACT_ICON[act]){
      // Habit objects only pulse when they are useful now: the current quest, or a job that is waiting.
      const j=sim.playerJob(k),pet=sim.pets[k.petId];
      const tasks=Object.keys(HABITS).filter(t=>HABITS[t].act===act&&k.habit[t]&&!pet.doneTasks.has(t));
      const useful=tasks.some(t=>(j&&j.task===t)||["todo","asked","go","help"].includes(k.habit[t]));
      return useful?ACT_ICON[act]:null;
    }
    return act==="critters"?"heart":"look";
  }
  return "look";
}
let aSig="";
function updateAHint(){const h=aHint()||"";if(h===aSig)return;aSig=h;btnA.classList.toggle("hint",!!h);const b=$("#aBadge");if(h){b.innerHTML=iconSvg(h,22);b.hidden=false;}else{b.hidden=true;b.innerHTML="";}}
function adultTalk(a,k){
  if(a.id==="theo"||a.id==="grandma"||a.id==="grandpa"){const l=LN("adult.chat."+a.id,k.id);localSay(`${nm(a.id)}: ${l.text}`,"narr",null,null);return;}
  const pending=Object.entries(k.habit).find(([t,s])=>s==="go"||s==="asked"||s==="todo");
  const act=pending?HABITS[pending[0]].act:null;
  const key=pending?`adult.check.${pending[0]==="homework"||pending[0]==="pack_bag"||pending[0]==="tidy"||pending[0]==="bath"||pending[0]==="bed"?pending[0]:act}.${a.id}`:`adult.chat.${a.id}`;
  const l=LN(key,k.id);localSay(`${nm(a.id)}: ${l.text}`,"narr",null,l.voice,l.text);
}
function objectAction(k,it){
  const habitActs={teeth:1,dress:1,desk:1,tidy:1,bath:1,bed:1};
  if(it.owner&&it.owner!==k.id&&(it.act==="dress"||it.act==="bed"||it.act==="desk")){sayLine("narr.not_yours",k.id);return;}
  if(habitActs[it.act]){
    const r=sim.playerAction(k.id,it.act);
    if(r.ok){const l=LN(r.msgKey,k.id);voiceSpeak(l.text,l.voice);showToast(l.text,HABIT_ICON[r.task]);}
    else sayLine(r.msgKey||"narr.nothing_to_do",k.id);
    return;
  }
  const pet=sim.pets[k.petId];
  if(it.act==="critters"){
    const g=gardenFor(k.id);
    if(g.friends.length){sayLine("narr.critter",k.id);sim.sparkle({x:36.5,y:10.4},10);}
    else if(g.shy.length)sayLine("narr.critter_shy",k.id);
    else sayLine("narr.critter_none",k.id);
    return;
  }
  if(it.act==="pond")pet.curiosity+=1;
  sayLine("narr."+it.act,k.id);
}

function onEncounter(talk,o,done){
  const playing=(mode==="alfie"||mode==="ruby");
  const isPlayer=playing&&talk.kid.id===mode;
  if(encounterOpen)return false;
  if(!isPlayer){if(!cfg.showEncounters||ffwd||speedKey===16||playing)return false;if(!camWhole&&talk.kid.id!==focusKidId())return false;}

let encMeta=null;
function openEncounter(o,emode,done){

  let finished=false;
  const finish=res=>{if(finished)return;finished=true;encounterOpen=false;encounterHandle=null;encMeta=null;layer.hidden=true;mount.innerHTML="";done(res,{live:true,player:emode==="play"});updateHud(true);};
  encMeta={t0:performance.now(),capLeft:+o.capLeft,player:emode==="play"};

    try{

      encounterHandle=Challenges.start({container:mount,kidId:o.kidId,kidName:o.kidName,petId:o.petId,petName:o.petName,stage:o.stage,learner:o.learner,day:o.day,n:o.n,mode:emode,autoSkill:o.autoSkill,speed:emode==="auto"?(speedKey===4?4:1.6):1,onDone:res=>finish(res)});

// A played puzzle that runs well past the daily cap ends gently ("Done for now"), then the pet says goodbye.
function checkEncounterCap(){
  if(!encounterOpen||!encMeta||!encMeta.player||!encounterHandle||!isFinite(encMeta.capLeft))return;
  if((performance.now()-encMeta.t0)/60000>encMeta.capLeft+2){encMeta=null;try{encounterHandle.abort();}catch(e){}}
}
function fallbackQuiz(mount,o,emode,finish){

  const items=L.pick(o.n,o.day);const critter=fbPickCritter(o.kidId,Math.random);const cname=critterName(critter);

    <div class="meterline" id="fbMeter">${items.map(()=>"<i></i>").join("")}</div><div class="pic" id="fbPic"></div><div class="q" id="fbQ"></div><div class="opts" id="fbOpts"></div><div class="say" id="fbSay"></div>
    <div class="row" style="justify-content:center"><button class="btn" type="button" id="fbStop">${emode==="auto"?"Skip":"Stop"}</button></div></div>`;
  const q=$("#fbQ",mount),opts=$("#fbOpts",mount),say=$("#fbSay",mount),pic=$("#fbPic",mount);
  $("#fbStop",mount).addEventListener("click",()=>end());
  const end=()=>finish({critterId:critter,befriended:items.length>0&&right>=Math.ceil(items.length*.6),asked:out.length,right,items:out,seconds:Math.round((performance.now()-t0)/1000)});
  const show=()=>{
    if(i>=items.length){{const l=LN((right>=Math.ceil(items.length*.6)?"fb.friend.":"fb.again.")+o.petId,o.kidId);say.textContent=l.text;voiceSpeak(l.text,l.voice);}q.textContent="";opts.innerHTML="";pic.textContent="";setTimeout(end,emode==="auto"?900:1500);return;}
    const it=items[i];q.textContent=it.q;pic.innerHTML=it.picIcon?iconSvg(it.picIcon,30).repeat(it.picN||1):esc(it.pic||"");{const l=LN("narr.help_pet",o.kidId);say.textContent=l.text;if(emode==="play")voiceSpeak(l.text,l.voice);}
    const os=shuffle(it.opts,Math.random);
    opts.innerHTML=os.map(v=>`<button type="button" data-v="${esc(v)}">${it.swatch?`<span class="dot" style="background:${SWATCH[v]};width:22px;height:22px"></span> `:""}${esc(v)}</button>`).join("");
    const choose=v=>{const c=v===it.answer;L.answer(it,c,o.day);out.push({id:it.id,skill:it.skill,correct:c});if(c)right++;
      opts.querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.dataset.v===it.answer)b.classList.add("right");else b.classList.add("wrong");});
      $("#fbMeter",mount).children[i].classList.toggle("on",c);
      {const l=LN((c?"fb.right.":"fb.together.")+o.petId,o.kidId);say.textContent=l.text;if(emode==="play")voiceSpeak(l.text,l.voice);}
      i++;setTimeout(show,emode==="auto"?700:1200);};
    opts.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.v)));
    if(emode==="auto")setTimeout(()=>{const p=clamp(.75*(o.autoSkill||1),.1,.97);const v=Math.random()<p?it.answer:pickR(it.opts.filter(x=>x!==it.answer),Math.random);choose(v);},900);
  };
  show();
}

async function runCompare(){

let last=performance.now(),uiAcc=0,hintAcc=0,rafId=0;
function frame(now){
  const realDt=Math.min(.1,(now-last)/1000);last=now;
  if(sim){
    updatePlayer(realDt);
    if(player.faceTarget&&!player.moving&&!player.path.length){const k=playerKid();if(k){const [fx,fy]=player.faceTarget,dx=fx-Math.floor(k.x),dy=fy-Math.floor(k.y);if(Math.abs(dx)+Math.abs(dy)===1){k.dir=dx>0?"right":dx<0?"left":dy>0?"down":"up";if(player.autoUse&&canPlayerMove(k))interact();}}player.faceTarget=null;player.autoUse=false;}
    if(running&&!sim.dayEnded&&!encounterOpen){
      const playing=(mode==="alfie"||mode==="ruby"),pk=playerKid();
      let speed=SPEEDS[speedKey];
      if(playing&&pk&&(pk.away||(pk.asleep&&!sim.dayEnded)))speed=SKIP_SPEED;
      if(playing&&pk&&pk.doing&&pk.doing.phase==="perform")speed=Math.max(speed,3);
      if(playing&&pk&&pk.block&&(pk.block.spot||pk.block.act==="waking"))speed=Math.max(speed,1.2);
      const fk=playing?mode:focusKidId();
      const hit=()=>camWhole&&!playing?sim.talks.size>0:sim.talkingWith(fk);
      // Watching: skip the empty house (everyone out or asleep) automatically.
      if(!playing&&houseEmpty())speed=SKIP_SPEED;
      if(ffwd){speed=SKIP_SPEED;if(hit())ffwd=false;}
      if(!ffwd&&!playing&&speedKey!==16&&sim.anySpeaking(camWhole?null:fk))speed=Math.min(speed,FOLLOW_CAP[speedKey]||speed);
      let simDt=realDt*speed;
      while(simDt>1e-6){const d=Math.min(simDt,.05);sim.step(d);simDt-=d;if(sim.dayEnded||sim.waitingUser())break;if(ffwd&&hit()){ffwd=false;break;}}
    }
    if(!encounterOpen)render(now,realDt);else checkEncounterCap();
    updateDialog(realDt);
    hintAcc+=realDt;if(hintAcc>.1){hintAcc=0;updateAHint();}
    uiAcc+=realDt;if(uiAcc>.25){uiAcc=0;updateHud();renderPanel(false);if(now-gardenAt>1500)refreshGarden();}
  }
  rafId=requestAnimationFrame(frame);
}

function clipUrls(){
  const out=new Set();
  try{const A=window.KINDLINGS_AUDIO;if(!A)return [];
    const add=u=>{if(typeof u==="string"&&!/^https?:/.test(u))out.add(new URL(/^(\.\/|audio\/)/.test(u)||u.indexOf("/")>=0?u:"audio/"+u,location.href).href);};
    const one=c=>{if(!c)return;if(typeof c==="string"){add(c);return;}if(typeof c==="object"){const u=c.src||c.file||c.url;if(typeof u==="string")add(u);else Object.values(c).forEach(add);}};
    Object.values(A.clips||{}).forEach(one);Object.values(A.named||{}).forEach(one);
  }catch(e){}
  return [...out];
}
async function countSaved(){
  const want=new Set(clipUrls()),total=want.size;let have=0;
  for(const k of await caches.keys()){if(!k.startsWith("kindlings-"))continue;for(const r of await (await caches.open(k)).keys())if(want.delete(r.url))have++;}
  return {have,total};
}

  if(location.protocol==="file:")return `<p class="small" style="margin:0"><span class="pill good">Plays offline</span> Opened from a file on this device, so it needs no connection. Voices play when the audio folder sits next to the file.</p>`;
  if(swActive){
    const v=voiceSaved,count=v.total?` Voices: ${fmtN(v.have)} of ${fmtN(v.total)} saved.`:"";
    if(offlineReady)return `<p class="small" style="margin:0"><span class="pill good">Offline ready</span> The game and all its voices are saved on this device. It plays with no connection.${count}</p>`;
    if(offlineCore)return `<p class="small" style="margin:0"><span class="pill mute">Saving voices...</span> The game itself already plays with no connection.${count} The rest save while you're online, so keep it open on Wi-Fi for a minute.</p>`;
    return `<p class="small" style="margin:0"><span class="pill mute">Saving for offline...</span>${count}</p>`;
  }
  return `<p class="small" style="margin:0"><span class="pill mute">Offline install not available here</span> This view can't save the game for offline play. Open it from its own web address (and add it to the home screen) and it saves itself.</p>`;
}
function showOfflineStatus(){const el=document.getElementById("offlineStatus");if(el)el.innerHTML=offlineStatusInner();}
function askTopUp(reg){try{const w=navigator.serviceWorker.controller||(reg&&reg.active);if(w)w.postMessage({type:"top-up"});}catch(e){}}
function initServiceWorker(){
  try{
    const okProto=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
    if(window.KINDLINGS_NO_SW||!okProto||!("serviceWorker" in navigator)||window.top!==window.self)return;
    navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(reg=>{swActive=true;askTopUp(reg);checkOffline();}).catch(()=>{});
    navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};if(d.type==="progress"||d.type==="cached"||d.type==="activated")checkOffline();});
    // Back online after a patchy spell: fetch whatever voices are still missing.
    window.addEventListener("online",()=>{navigator.serviceWorker.ready.then(askTopUp).catch(()=>{});});
  }catch(e){}
}
function checkOffline(){
  clearTimeout(offlineTimer);
  try{
    Promise.all([Promise.all(OFFLINE_FILES.map(f=>caches.match(new URL(f,location.href).href))),countSaved()]).then(([rs,v])=>{
      const core=rs.every(Boolean),ready=core&&v.have>=v.total;
      const changed=core!==offlineCore||ready!==offlineReady||v.have!==voiceSaved.have||v.total!==voiceSaved.total;
      offlineCore=core;voiceSaved=v;offlineReady=ready;
      if(changed)showOfflineStatus();
      if(!ready)offlineTimer=setTimeout(checkOffline,3000);
    }).catch(()=>{});
  }catch(e){}
}

function firstRunCard(){
  modal(`<h2>Who's playing?</h2><p style="margin:0">Type the children's names. They stay on this phone only and are never sent anywhere.</p>
    <div class="grid2"><label class="field" for="fr-alfie">Younger child (3)<input id="fr-alfie" value="${esc(FAMILY.kids.alfie)}" maxlength="24" autocomplete="off"></label>
    <label class="field" for="fr-ruby">Older child (6)<input id="fr-ruby" value="${esc(FAMILY.kids.ruby)}" maxlength="24" autocomplete="off"></label></div>
    <p class="hint">You can change these and the pets' names any time in Menu, Parent, Names.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="frSkip">Skip</button><button class="btn primary" type="button" id="frSave">Let's play</button></div>`);
  const done=save=>{if(save){const a=$("#fr-alfie").value.trim(),b=$("#fr-ruby").value.trim();if(a)FAMILY.kids.alfie=a.slice(0,24);if(b)FAMILY.kids.ruby=b.slice(0,24);}saveFamily();applyNames();closeModal();showScenarioCard();};
  $("#frSave").addEventListener("click",()=>done(true));$("#frSkip").addEventListener("click",()=>done(false));
}
function boot(){
  drawStaticLayer();
  resize();
  newSim();
  if(window.innerWidth<1000)camWhole=false;else camWhole=true;
  applyMode("watch",true);applyNames();syncSpeed();
  if(wide())renderPanel(true);
  updateHud(true);
  rafId=requestAnimationFrame(frame);
  if(!familySaved())firstRunCard();else showScenarioCard();
  applyVoiceSettings();
  initServiceWorker();
  // Dev check: every named spot must be walkable.
  for(const [k,s] of Object.entries(SPOTS))if(!/_bed$/.test(k)&&!walkable(s[0],s[1],"walk"))console.warn("Spot not walkable:",k,s);
}
boot();
</script>
